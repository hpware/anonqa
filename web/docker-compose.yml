services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:?Set NEXT_PUBLIC_CONVEX_URL in .env}
        NEXT_PUBLIC_CF_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_CF_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_CAPTCHA_FEAT: ${NEXT_PUBLIC_CAPTCHA_FEAT:-false}
        NEXT_PUBLIC_DISABLE_REGISTER: ${NEXT_PUBLIC_DISABLE_REGISTER:-true}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_SERVER_USER_TERMS: ${NEXT_PUBLIC_SERVER_USER_TERMS:-}
        NEXT_PUBLIC_ADMINISTRATOR_EMAIL: ${NEXT_PUBLIC_ADMINISTRATOR_EMAIL:-}
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
